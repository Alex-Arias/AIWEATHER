[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "aiweather"
dynamic = [
    "version",
]
description = "AIWeather forecasting, tropical cyclone tracking, and verification toolkit"
requires-python = ">=3.11"

[project.scripts]
aiweather = "aiweather.cli:main"

[tool.setuptools.packages.find]
include = [
    "aiweather*",
]

[tool.setuptools.dynamic]
version = { attr = "aiweather.version.__version__" }

[tool.pytest.ini_options]
pythonpath = [
    ".",
]

markers = [
    "gpu: tests that require a CUDA GPU",
    "integration: tests that require external models, data, or system resources",
]

testpaths = [
    "tests",
]